<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>sd2api 账号池</title>
  <style>
    :root{color-scheme:dark;--bg:#090c12;--panel:#111722;--line:#263044;--text:#eef3ff;--muted:#95a2b8;--brand:#68d6ad;--warn:#ffca68;--bad:#ff7e89;--blue:#73a7ff}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#15352f 0,transparent 32%),var(--bg);color:var(--text);font:14px/1.5 ui-sans-serif,system-ui,"Microsoft YaHei",sans-serif}
    main{max-width:1440px;margin:auto;padding:28px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}h1{font-size:26px;margin:0}h2{font-size:17px;margin:0 0 14px}.sub{color:var(--muted);margin-top:4px}.actions{display:flex;gap:9px;flex-wrap:wrap}
    button,.button{border:1px solid var(--line);background:#182131;color:var(--text);padding:8px 12px;border-radius:9px;cursor:pointer;text-decoration:none;font:inherit}button:hover,.button:hover{border-color:#52627d}.primary{background:var(--brand);border-color:var(--brand);color:#07120e;font-weight:700}.danger{color:var(--bad)}
    .stats{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));gap:12px;margin-bottom:16px}.card,.panel{background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px #0004}.card{padding:15px}.value{font-size:26px;font-weight:750}.label{color:var(--muted);font-size:12px}.panel{padding:17px;margin-top:14px;overflow:auto}
    table{border-collapse:collapse;width:100%;min-width:1080px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #20293a;vertical-align:middle}th{color:var(--muted);font-size:12px;font-weight:600}tr:last-child td{border-bottom:0}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}.muted{color:var(--muted)}
    .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);padding:3px 8px;border-radius:999px;font-size:12px;white-space:nowrap}.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}.ok:before{background:var(--brand)}.wait:before{background:var(--warn)}.bad:before{background:var(--bad)}.info:before{background:var(--blue)}
    .notice{padding:11px 13px;border:1px solid #5e4b27;background:#2c2518;border-radius:10px;color:#ffe1a8;margin-bottom:14px}.hidden{display:none!important}.row-actions{display:flex;gap:6px;flex-wrap:wrap}.row-actions button{padding:5px 8px;font-size:12px}
    .subaccounts{display:grid;gap:7px;padding:6px 0}.sub-row{display:grid;grid-template-columns:minmax(230px,1.4fr) 130px 90px 90px minmax(160px,1fr);align-items:center;gap:10px;padding:9px 11px;background:#0b1019;border:1px solid #20293a;border-radius:10px}.sub-name{display:flex;align-items:flex-start;gap:9px}.sub-name input{width:auto;margin-top:3px}.sub-error{color:var(--bad);font-size:12px}.account-divider td{background:#0c111a}
    dialog{width:min(560px,calc(100vw - 24px));background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:15px;padding:22px;box-shadow:0 24px 80px #000a}dialog::backdrop{background:#02050bb8}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:5px}.wide{grid-column:1/-1}input{width:100%;background:#0b1019;border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--text);font:inherit}input:focus{outline:2px solid #68d6ad55;border-color:var(--brand)}label{color:#c7d1e2}.check{display:flex;align-items:center;gap:8px}.check input{width:auto}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.error{color:var(--bad);white-space:pre-wrap}.empty{text-align:center;color:var(--muted);padding:28px}
    #auth{position:fixed;inset:0;background:#070a10eF;display:grid;place-items:center;z-index:10}.auth-box{width:min(440px,calc(100vw - 30px));padding:25px}.auth-box h2{font-size:22px}.auth-box input{margin:10px 0 14px}
    @media(max-width:900px){main{padding:18px}.stats{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}}
  </style>
</head>
<body>
<div id="auth"><div class="panel auth-box"><h2>连接 sd2api</h2><div class="sub">输入 SD2API_ADMIN_KEY。密钥只保存在当前浏览器的 sessionStorage。</div><input id="adminKey" type="password" autocomplete="current-password" placeholder="Admin Key"><button class="primary" onclick="connect()">进入账号池</button><div id="authError" class="error"></div></div></div>
<main>
  <div class="top"><div><h1>TikTok Ads 账号池</h1><div class="sub">自动登录、邮箱接码、并发调度与运行状态</div></div><div class="actions"><a class="button" id="novnc" target="_blank">打开 noVNC</a><button onclick="refreshAll()">刷新</button><button class="primary" onclick="openAdd()">添加账号</button></div></div>
  <div id="configNotice" class="notice hidden"></div>
  <section class="stats">
    <div class="card"><div class="value" id="sTotal">0</div><div class="label">账号总数</div></div>
    <div class="card"><div class="value" id="sOnline">0</div><div class="label">已登录</div></div>
    <div class="card"><div class="value" id="sLogin">0</div><div class="label">登录中</div></div>
    <div class="card"><div class="value" id="sCaptcha">0</div><div class="label">需要图形验证</div></div>
    <div class="card"><div class="value" id="sSubs">0</div><div class="label">已启用子账号</div></div>
    <div class="card"><div class="value" id="sJobs">0</div><div class="label">运行任务</div></div>
    <div class="card"><div class="value" id="sParallel">0</div><div class="label">可用并发</div></div>
  </section>
  <section class="panel"><h2>登录账号与 TikTok 子账号</h2><table><thead><tr><th>登录账号</th><th>登录状态</th><th>Chromium</th><th>发现子账号</th><th>已启用</th><th>任务</th><th>最近错误</th><th>操作</th></tr></thead><tbody id="accounts"></tbody></table></section>
  <section class="panel"><h2>最近任务</h2><table><thead><tr><th>任务 ID</th><th>登录账号 / 子账号</th><th>模型</th><th>状态</th><th>进度</th><th>时长</th><th>更新时间</th></tr></thead><tbody id="tasks"></tbody></table></section>
</main>

<dialog id="accountDialog"><form id="accountForm"><h2 id="dialogTitle">添加账号</h2><div class="form-grid">
  <div class="field wide hidden" id="remarkField"><label>备注名称</label><input name="name" maxlength="128" placeholder="例如：主账号（加入号池后可设置）"></div>
  <div class="field wide"><label>TikTok Ads 登录邮箱</label><input name="username" type="email" autocomplete="username" required placeholder="此邮箱同时用于接收登录验证码"></div>
  <div class="field wide"><label>登录密码 <span class="muted" id="passwordHint"></span></label><input name="password" type="password" autocomplete="new-password"></div>
  <label class="check"><input name="auto_login" type="checkbox" checked> 掉线后自动重登</label>
  <label class="check" id="startField"><input name="start" type="checkbox" checked> 立即启动 Chromium</label>
</div><div id="formError" class="error"></div><div class="dialog-actions"><button type="button" onclick="accountDialog.close()">取消</button><button class="primary" type="submit">保存</button></div></form></dialog>

<script>
let key=sessionStorage.getItem('sd2api_admin_key')||'';let accountsCache=[];let editId=null;
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('novnc').href=`${location.protocol}//${location.hostname}:6080/vnc.html?autoconnect=1&resize=scale`;
async function api(path,options={}){const headers={...(options.headers||{}),Authorization:`Bearer ${key}`};if(options.body&&!headers['Content-Type'])headers['Content-Type']='application/json';const r=await fetch(path,{...options,headers});if(r.status===401){showAuth('Admin Key 不正确或已失效');throw new Error('Unauthorized')}let data=null;try{data=await r.json()}catch{}if(!r.ok)throw new Error(data?.error?.message||(typeof data?.detail==='string'?data.detail:JSON.stringify(data?.detail||data||`HTTP ${r.status}`)));return data}
function showAuth(msg=''){auth.classList.remove('hidden');$('authError').textContent=msg}
async function connect(){key=$('adminKey').value.trim();try{await api('/admin/config/status');sessionStorage.setItem('sd2api_admin_key',key);auth.classList.add('hidden');refreshAll()}catch(e){$('authError').textContent=e.message}}
if(key){$('adminKey').value=key;connect()}else showAuth();
const stateMap={logged_in:['已登录','ok'],captcha_required:['请完成图形验证码','wait'],waiting_email_code:['自动获取邮箱验证码','info'],waiting_email_code_manual:['请手动输入邮箱验证码','wait'],submitting_email_code:['正在提交邮箱验证码','info'],opening_login:['打开登录页','info'],recovering_browser:['正在恢复 Chromium','info'],browser_closed:['Chromium 已关闭','wait'],browser_error:['Chromium 异常','bad'],entering_credentials:['输入账号密码','info'],waiting_for_login:['等待登录结果','info'],logging_in:['登录中','info'],login_failed:['登录失败','bad'],not_configured:['未配置凭据','bad'],not_logged_in:['未登录','wait'],not_started:['尚未启动','wait'],pending:['等待登录','wait'],queued:['排队中','wait'],running:['生成中','info'],succeeded:['已完成','ok'],failed:['失败','bad']};
function pill(state){const [text,cls]=stateMap[state]||[state||'未知',''];return `<span class="pill ${cls}">${esc(text)}</span>`}
async function refreshAll(){try{const [pool,config,accountData,taskData]=await Promise.all([api('/admin/pool/status'),api('/admin/config/status'),api('/admin/accounts'),api('/admin/tasks?limit=30')]);accountsCache=accountData.data||[];renderStats(pool);renderConfig(config);renderAccounts(accountsCache);renderTasks(taskData.data||[])}catch(e){console.error(e)}}
function renderStats(p){$('sTotal').textContent=p.total||0;$('sOnline').textContent=p.logged_in||0;$('sLogin').textContent=p.logging_in||0;$('sCaptcha').textContent=p.captcha_required||0;$('sSubs').textContent=p.enabled_subaccounts||0;$('sJobs').textContent=p.running_jobs||0;$('sParallel').textContent=p.max_parallel||0}
function renderConfig(c){let notes=[];if(c.mode!=='browser_pool')notes.push('当前 SD2API_MODE 不是 browser_pool，账号池 API 不可用。');if(!c.temp_mail_configured)notes.push('尚未配置 cf_temp_mail：请设置 SD2API_TEMP_MAIL_BASE_URL 和 SD2API_TEMP_MAIL_API_KEY。');if(!c.credential_encryption)notes.push('没有可用的凭据加密主密钥。');$('configNotice').textContent=notes.join(' ');$('configNotice').classList.toggle('hidden',!notes.length)}
function renderSubaccounts(a){const items=a.subaccounts||[];if(!items.length)return '<div class="empty">登录后点击“扫描子账号”，程序会发现 Client/Partner 账号并检查权限与 Credits。</div>';return `<div class="subaccounts">${items.map(s=>`<div class="sub-row"><div class="sub-name"><input type="checkbox" ${s.enabled?'checked':''} ${s.seedance_access!==true?'disabled':''} onchange="toggleSub('${esc(a.id)}','${esc(s.advertiser_id)}',this.checked)"><div><strong>${esc(s.name)}</strong><div class="mono muted">${esc(s.advertiser_id)} · ${esc(s.account_type)}</div></div></div><div>${s.seedance_access===true?'<span class="pill ok">SD2 可用</span>':s.seedance_access===false?'<span class="pill bad">无 SD2 权限</span>':'<span class="pill wait">未检查</span>'}</div><div><strong>${s.credits??'—'}</strong><div class="muted">Credits</div></div><div>${s.active?'<span class="pill info">当前</span>':'—'}</div><div class="sub-error">${esc(s.last_error||'')}</div></div>`).join('')}</div>`}
function renderAccounts(items){const body=$('accounts');if(!items.length){body.innerHTML='<tr><td colspan="8" class="empty">还没有登录账号，点击“添加账号”开始。</td></tr>';return}body.innerHTML=items.map(a=>`<tr><td><strong>${esc(a.name)}</strong><div class="mono muted">${esc(a.id)}</div><div class="muted">${esc(a.username||'')}</div></td><td>${pill(a.login_state)}<div class="muted">${a.logged_in?'会话有效':'会话不可用'}</div></td><td>${a.enabled?'启用':'停用'} · ${a.running?'运行':'停止'}</td><td>${(a.subaccounts||[]).length}</td><td>${(a.subaccounts||[]).filter(s=>s.enabled).length}</td><td>${a.busy?'运行中':'空闲'} / 排队 ${a.queued||0}</td><td class="error">${esc(a.login_error||a.last_error||'')}</td><td><div class="row-actions"><button onclick="doAction('${esc(a.id)}','login')">登录</button><button onclick="refreshSubs('${esc(a.id)}')">扫描子账号</button><button onclick="doAction('${esc(a.id)}','focus')">聚焦</button><button onclick="openEdit('${esc(a.id)}')">编辑</button>${a.running?`<button onclick="doAction('${esc(a.id)}','stop')">停止</button>`:`<button onclick="doAction('${esc(a.id)}','start')">启动</button>`}<button class="danger" onclick="removeAccount('${esc(a.id)}')">删除</button></div></td></tr><tr class="account-divider"><td colspan="8">${renderSubaccounts(a)}</td></tr>`).join('')}
function renderTasks(items){const body=$('tasks');if(!items.length){body.innerHTML='<tr><td colspan="7" class="empty">暂无任务</td></tr>';return}body.innerHTML=items.map(t=>`<tr><td class="mono">${esc(t.id)}</td><td>${esc(t.account_id||'—')}<div class="mono muted">${esc(t.advertiser_id||'—')}</div></td><td>${esc(t.model)}</td><td>${pill(t.status)}</td><td>${t.progress}%</td><td>${t.seconds}s</td><td>${new Date(t.updated_at*1000).toLocaleString()}</td></tr>`).join('')}
function openAdd(){editId=null;$('dialogTitle').textContent='添加账号';$('passwordHint').textContent='';accountForm.reset();$('remarkField').classList.add('hidden');accountForm.elements.name.disabled=true;accountForm.elements.password.required=true;$('startField').classList.remove('hidden');accountForm.elements.auto_login.checked=true;accountForm.elements.start.checked=true;$('formError').textContent='';accountDialog.showModal()}
function openEdit(id){const a=accountsCache.find(x=>x.id===id);if(!a)return;editId=id;$('dialogTitle').textContent='编辑账号与备注';$('passwordHint').textContent='（留空表示不修改）';accountForm.reset();$('remarkField').classList.remove('hidden');accountForm.elements.name.disabled=false;accountForm.elements.name.required=true;accountForm.elements.password.required=false;$('startField').classList.add('hidden');for(const k of ['name','username'])accountForm.elements[k].value=a[k]||'';accountForm.elements.auto_login.checked=!!a.auto_login;$('formError').textContent='';accountDialog.showModal()}
accountForm.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(accountForm);const data={username:f.get('username'),auto_login:f.get('auto_login')==='on'};const password=f.get('password');if(password)data.password=password;if(editId){data.name=f.get('name')}else{data.start=f.get('start')==='on'}try{await api(editId?`/admin/accounts/${editId}`:'/admin/accounts',{method:editId?'PATCH':'POST',body:JSON.stringify(data)});accountDialog.close();refreshAll()}catch(err){$('formError').textContent=err.message}});
async function doAction(id,action){try{await api(`/admin/accounts/${id}/${action}`,{method:'POST',body:action==='login'?'{"wait":false}':undefined});refreshAll()}catch(e){alert(e.message)}}
async function refreshSubs(id){try{await api(`/admin/accounts/${id}/subaccounts/refresh`,{method:'POST',body:'{"check_access":true}'});refreshAll()}catch(e){alert(e.message)}}
async function toggleSub(id,advertiserId,enabled){try{await api(`/admin/accounts/${id}/subaccounts/${advertiserId}`,{method:'PATCH',body:JSON.stringify({enabled})});refreshAll()}catch(e){alert(e.message);refreshAll()}}
async function removeAccount(id){if(!confirm(`删除账号 ${id} 的管理记录？浏览器 Profile 会保留。`))return;try{await api(`/admin/accounts/${id}`,{method:'DELETE'});refreshAll()}catch(e){alert(e.message)}}
setInterval(()=>{if(key&&!auth.classList.contains('hidden'))return;if(key)refreshAll()},5000);
</script>
</body>
</html>
