[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sd2api"
version = "0.1.0"
description = "TikTok Symphony Seedance web adapter with Seedance and OpenAI-compatible video APIs"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=45,<47",
  "curl-cffi>=0.13,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pillow>=11,<13",
  "playwright==1.62.0",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[tool.setuptools.packages.find]
include = ["sd2api*"]

[tool.setuptools.package-data]
sd2api = ["static/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
